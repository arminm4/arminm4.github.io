# Builds the Android app (a Trusted Web Activity that opens the PWA full-screen)
# and publishes the signed APK as a workflow artifact and as a GitHub Release.
# Run it from the Actions tab → "Build Android APK" → "Run workflow".
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Work out the web app address
        id: site
        env:
          PWA_URL: ${{ vars.PWA_URL }}
        run: |
          if [ -n "$PWA_URL" ]; then
            url="$PWA_URL"
          else
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            repo="${GITHUB_REPOSITORY#*/}"
            if [ "${repo,,}" = "${owner}.github.io" ]; then url="https://${owner}.github.io/"; else url="https://${owner}.github.io/${repo}/"; fi
          fi
          case "$url" in */) ;; *) url="$url/";; esac
          host=$(echo "$url" | sed -E 's#^https?://([^/]+).*#\1#')
          path=$(echo "$url" | sed -E 's#^https?://[^/]+##')
          echo "url=$url"   >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "### App address: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            pass="$KEYSTORE_PASSWORD"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "Using your signing key from repository secrets." >> "$GITHUB_STEP_SUMMARY"
          else
            pw="temp-$(openssl rand -hex 12)"
            pass="$pw"
            echo "::add-mask::$pw"
            keytool -genkeypair -keystore "$ks" -alias temp -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$pw" -keypass "$pw" -dname "CN=Armo Learn (temporary)" >/dev/null
            echo "ANDROID_KEYSTORE_PASSWORD=$pw" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=temp" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$pw" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret found, so this APK is signed with a throw-away key. It installs and works, but shows a URL bar and can't be updated in place. Run scripts/create-signing-key.ps1 and add the secrets (see README)."
            echo "⚠️ Signed with a temporary key (see README → Signing key)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ANDROID_KEYSTORE_PATH=$ks" >> "$GITHUB_ENV"
          fp=$(keytool -list -v -keystore "$ks" -storepass "$pass" | grep -m1 'SHA256:' | awk '{print $2}')
          echo "Signing certificate SHA-256: \`$fp\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build signed release APK
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease \
            -PtwaHost="${{ steps.site.outputs.host }}" \
            -PtwaPath="${{ steps.site.outputs.path }}" \
            -PappId="${{ vars.ANDROID_APP_ID || 'io.github.armolearn.app' }}" \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="1.0.${{ github.run_number }}"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/ArmoLearn-1.0.${{ github.run_number }}.apk"
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: ArmoLearn-apk-1.0.${{ github.run_number }}
          path: dist/*.apk

      - name: Publish GitHub Release (easy download on your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-v1.0.${{ github.run_number }}"
          gh release create "$tag" dist/*.apk \
            --title "Armo Learn Android 1.0.${{ github.run_number }}" \
            --notes "Install on Android: download the .apk on your phone, open it, and allow installs from your browser/files app if asked. Opens ${{ steps.site.outputs.url }}" \
            --latest
